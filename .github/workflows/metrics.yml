name: Metrics
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: ""
          plugin_traffic: yes
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_limit: 5
          config_timezone: Asia/Jakarta
